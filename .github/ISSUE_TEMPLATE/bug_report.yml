name: Bug Report
description: Report a defect affecting the platform or app behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please provide clear reproduction details.
  - type: input
    id: area
    attributes:
      label: Affected area
      description: Route/module impacted (for example `/apps`, `src/lib/auth`, `docs`).
      placeholder: src/components/layout/navbar.tsx
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      placeholder: Browser/OS/Node version, etc.
